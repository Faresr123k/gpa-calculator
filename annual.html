<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المعدل السنوي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        input[type="number"] {
            width: 70px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .text-pass { color: #27ae60; }
        .text-fail { color: #e74c3c; }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #eee;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>حاسبة المعدل السنوي</h1>

        <!-- السداسي الأول -->
        <h2>السداسي الأول</h2>
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>المعامل</th>
                    <th>الرصيد</th>
                    <th>الامتحان</th>
                    <th>المراقبة المستمرة</th>
                </tr>
            </thead>
            <tbody id="s1-table">
                <!-- أسطر مواد السداسي الأول -->
            </tbody>
        </table>

        <!-- السداسي الثاني -->
        <h2>السداسي الثاني</h2>
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>المعامل</th>
                    <th>الرصيد</th>
                    <th>الامتحان</th>
                    <th>المراقبة المستمرة</th>
                </tr>
            </thead>
            <tbody id="s2-table">
                <!-- أسطر مواد السداسي الثاني -->
            </tbody>
        </table>

        <button onclick="calculateAnnual()">حساب المعدل السنوي</button>

        <!-- قسم النتائج -->
        <div id="result-section" style="display:none; margin-top: 20px;">
            <div class="result-box" id="s1-res">
                معدل السداسي الأول: <span id="s1-gpa-val">--</span>
                <div class="badge" id="s1-credit-val">الرصيد: --</div>
            </div>
            
            <div class="result-box" id="s2-res">
                معدل السداسي الثاني: <span id="s2-gpa-val">--</span>
                <div class="badge" id="s2-credit-val">الرصيد: --</div>
            </div>

            <div class="result-box" id="final-annual-box">
                <!-- النتيجة النهائية تشمل المعدل والأرصدة الإجمالية -->
            </div>
        </div>
    </div>

</html>
